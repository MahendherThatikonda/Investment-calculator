<form id="user-input" (ngSubmit)="onCalculate()">

  <div class="input-group">
    <div class="input-field">
      <label for="initial-investment">INITIAL INVESTMENT</label>
      <input type="number" id="initial-investment" value="10000" [(ngModel)]="enteredInitialInvestment " />
    </div>
    <div class="input-field">
      <label for="annual-investment">ANNUAL INVESTMENT</label>
      <input type="number" id="annual-investment" value="1"  [(ngModel)]="enteredAnnualInvestment "/>
    </div>
  </div>

  <br>

  <div class="input-group">
    <div class="input-field">
      <label for="expected-return">EXPECTED RETURN</label>
      <input type="number" id="expected-return" value="5" [(ngModel)]="enteredExpectedReturn"/>
    </div>
    <div class="input-field">
      <label for="duration">DURATION</label>
      <input type="number" id="duration" value="10" [(ngModel)]="enteredDuration"/>
    </div>
  </div>

    <br>

  <button type="submit">CALCULATE</button>
<p>Please enter some values and press "Caclulate"</p>
</form>
